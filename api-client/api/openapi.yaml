openapi: 3.1.0
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for managing seat reservations with QR code ticket generation
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: QR Seat Reservation API
  version: 1.0.0
servers:
- description: Development Server
  url: http://localhost:8080
tags:
- description: Ticket check-in management API
  name: Check-in
- description: User management API
  name: Users
- description: Reservation management API
  name: Reservations
- description: Application settings management API
  name: Settings
- description: Seller management API
  name: Sellers
- description: Table and seat management API
  name: Tables
- description: Ticket generation and management API
  name: Tickets
paths:
  /api/users/{id}:
    delete:
      description: Permanently deletes a user account
      operationId: deleteUser
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: User deleted successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User not found - USER_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Delete user
      tags:
      - Users
      x-accepts: '*/*'
    get:
      description: Retrieves a specific user by their ID
      operationId: getUserById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Successfully retrieved user
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User not found - USER_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get user by ID
      tags:
      - Users
      x-accepts: '*/*'
    put:
      description: Updates user information. All fields are optional.
      operationId: updateUser
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: User updated successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid user data
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User not found - USER_NOT_FOUND
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Username already exists - USER_ALREADY_EXISTS
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Update user
      tags:
      - Users
      x-content-type: application/json
      x-accepts: '*/*'
  /api/tables/{id}:
    delete:
      description: Deletes a table and its associated seats. Cannot delete tables
        with active reservations.
      operationId: deleteTable
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: Table deleted successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Table not found - TABLE_NOT_FOUND
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Table has active reservations - TABLE_HAS_RESERVATIONS
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Delete table
      tags:
      - Tables
      x-accepts: '*/*'
    get:
      description: Retrieves a specific table by its ID
      operationId: getTableById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TableDetail'
          description: Successfully retrieved table
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Table not found - TABLE_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get table by ID
      tags:
      - Tables
      x-accepts: '*/*'
    put:
      description: Updates an existing table's details. Cannot update tables with
        active reservations.
      operationId: updateTable
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TableDetail'
          description: Table updated successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid table data
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Table not found - TABLE_NOT_FOUND
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Table name already exists (TABLE_ALREADY_EXISTS) or table has
            active reservations (TABLE_HAS_RESERVATIONS)
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Update table
      tags:
      - Tables
      x-content-type: application/json
      x-accepts: '*/*'
  /api/settings:
    get:
      description: Retrieves the current application settings
      operationId: getSettings
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Setting'
          description: Successfully retrieved settings
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get current settings
      tags:
      - Settings
      x-accepts: '*/*'
    put:
      description: Updates the application settings. All fields are optional - only
        provided fields will be updated.
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Setting'
          description: Successfully updated settings
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid settings data
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Update settings
      tags:
      - Settings
      x-content-type: application/json
      x-accepts: '*/*'
  /api/sellers/{id}:
    delete:
      description: Deletes a seller. Cannot delete sellers with active reservations.
      operationId: deleteSeller
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: Seller deleted successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Seller not found - SELLER_NOT_FOUND
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Seller has active reservations - SELLER_HAS_RESERVATIONS
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Delete seller
      tags:
      - Sellers
      x-accepts: '*/*'
    get:
      description: Retrieves a specific seller by their ID
      operationId: getSellerById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerDetail'
          description: Successfully retrieved seller
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Seller not found - SELLER_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get seller by ID
      tags:
      - Sellers
      x-accepts: '*/*'
    put:
      description: Updates an existing seller's details. Cannot update sellers with
        active reservations.
      operationId: updateSeller
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSellerRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerDetail'
          description: Seller updated successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid seller data
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Seller not found - SELLER_NOT_FOUND
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Seller name already exists (SELLER_ALREADY_EXISTS) or seller
            has active reservations (SELLER_HAS_RESERVATIONS)
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Update seller
      tags:
      - Sellers
      x-content-type: application/json
      x-accepts: '*/*'
  /api/users:
    get:
      description: Retrieves all registered users (passwords excluded)
      operationId: getAllUsers
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/UserResponse'
                type: array
          description: Successfully retrieved users
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get all users
      tags:
      - Users
      x-accepts: '*/*'
    post:
      description: Creates a new user account with encrypted password
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: User created successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid user data
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Username already exists - USER_ALREADY_EXISTS
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create user
      tags:
      - Users
      x-content-type: application/json
      x-accepts: '*/*'
  /api/tickets/generate:
    post:
      description: Generates new tickets. Uses count from request or settings if not
        provided.
      operationId: generateTickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTicketsRequest'
      responses:
        "201":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
          description: Tickets generated successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request data
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Generate tickets
      tags:
      - Tickets
      x-content-type: application/json
      x-accepts: '*/*'
  /api/tickets/generate/default:
    post:
      description: Generates tickets using settings configuration
      operationId: generateTicketsDefault
      responses:
        "201":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
          description: Tickets generated successfully
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Generate tickets (simple)
      tags:
      - Tickets
      x-accepts: '*/*'
  /api/tables:
    get:
      description: Retrieves all tables with their seat details
      operationId: getAllTables
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/TableDetail'
                type: array
          description: Successfully retrieved tables
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get all tables
      tags:
      - Tables
      x-accepts: '*/*'
    post:
      description: Creates a table with specified available and unavailable seats
      operationId: createTable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
        required: true
      responses:
        "201":
          description: Table created successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid table data
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Table already exists - TABLE_ALREADY_EXISTS
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create custom table
      tags:
      - Tables
      x-content-type: application/json
      x-accepts: '*/*'
  /api/sellers:
    get:
      description: Retrieves all registered sellers
      operationId: getAllSellers
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/SellerDetail'
                type: array
          description: Successfully retrieved sellers
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get all sellers
      tags:
      - Sellers
      x-accepts: '*/*'
    post:
      description: Creates a seller with individual parameters
      operationId: createCustomSeller
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSellerRequest'
        required: true
      responses:
        "201":
          description: Seller created successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid seller data
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Seller already exists - SELLER_ALREADY_EXISTS
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create custom seller
      tags:
      - Sellers
      x-content-type: application/json
      x-accepts: '*/*'
  /api/reservations:
    get:
      description: Retrieves all seat reservations
      operationId: getAllReservations
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/ReservationResponse'
                type: array
          description: Successfully retrieved reservations
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get all reservations
      tags:
      - Reservations
      x-accepts: '*/*'
    post:
      description: Creates a new seat reservation with specified seats and ticket
        types
      operationId: createReservation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReservationResponse'
          description: Reservation created successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid reservation data
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Seller or seat not found
        "409":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Seat already reserved - SEAT_ALREADY_RESERVED
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create reservation
      tags:
      - Reservations
      x-content-type: application/json
      x-accepts: '*/*'
  /api/checkin:
    post:
      description: Checks in a ticket. Only allowed for PAID reservations that haven't
        been checked in yet.
      operationId: checkInTicket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: Check-in processed (check success field for result)
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request data
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Check in ticket
      tags:
      - Check-in
      x-content-type: application/json
      x-accepts: '*/*'
  /api/checkin/{ticketNo}:
    post:
      description: Simplified endpoint to check in a ticket using path parameter
      operationId: checkInTicketByNumber
      parameters:
      - explode: false
        in: path
        name: ticketNo
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: Check-in processed (check success field for result)
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Check in ticket by number
      tags:
      - Check-in
      x-accepts: '*/*'
  /api/users/{id}/enable:
    patch:
      description: Enables a user account
      operationId: enableUser
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: User enabled successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User not found - USER_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Enable user
      tags:
      - Users
      x-accepts: '*/*'
  /api/users/{id}/disable:
    patch:
      description: Disables a user account
      operationId: disableUser
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: User disabled successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User not found - USER_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Disable user
      tags:
      - Users
      x-accepts: '*/*'
  /api/users/{id}/change-password:
    patch:
      description: Changes user password after verifying current password
      operationId: changePassword
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        "204":
          description: Password changed successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid password - INVALID_PASSWORD
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User not found - USER_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Change password
      tags:
      - Users
      x-content-type: application/json
      x-accepts: '*/*'
  /api/reservations/{id}/mark-paid:
    patch:
      description: Updates reservation status to PAID
      operationId: markReservationAsPaid
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReservationResponse'
          description: Reservation marked as paid successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Reservation not found - RESERVATION_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Mark reservation as paid
      tags:
      - Reservations
      x-accepts: '*/*'
  /api/users/username/{username}:
    get:
      description: Retrieves a specific user by their username
      operationId: getUserByUsername
      parameters:
      - explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Successfully retrieved user
        "404":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User not found - USER_NOT_FOUND
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get user by username
      tags:
      - Users
      x-accepts: '*/*'
  /api/users/exists/{username}:
    get:
      description: Checks if a username is already taken
      operationId: usernameExists
      parameters:
      - explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: boolean
          description: Successfully checked username
        "500":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Check username availability
      tags:
      - Users
      x-accepts: '*/*'
  /api/tickets:
    get:
      description: Retrieves all tickets with metadata (image data excluded)
