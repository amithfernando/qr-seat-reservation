components:
  schemas:
    UpdateUserRequest:
      description: Request object for updating user information
      example:
        password: NewSecurePass123!
        role: ADMIN
        enabled: true
        username: admin_new
      properties:
        username:
          description: New username (optional)
          example: admin_new
          maxLength: 64
          minLength: 3
          type: string
        password:
          description: "New password (optional, will be encrypted)"
          example: NewSecurePass123!
          maxLength: 100
          minLength: 6
          type: string
        role:
          description: New role (optional)
          enum:
          - ADMIN
          - ENTRANCE
          example: ADMIN
          type: string
        enabled:
          description: Whether the user account is enabled (optional)
          example: true
          type: boolean
    ErrorResponse:
      description: Standard error response
      properties:
        errorCode:
          description: Error code
          example: TABLE_NOT_FOUND
          type: string
        message:
          description: Error message
          example: Table T1 not found
          type: string
        status:
          description: HTTP status code
          example: 404
          format: int32
          type: integer
        timestamp:
          description: Timestamp of the error
          format: date-time
          type: string
        path:
          description: Request path where the error occurred
          example: /api/tables
          type: string
        validationErrors:
          description: Validation errors (if applicable)
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
    ValidationError:
      description: Validation error details
      properties:
        field:
          description: Field name
          example: tableName
          type: string
        rejectedValue:
          description: Rejected value
          type: object
        message:
          description: Error message
          example: must not be blank
          type: string
    UserResponse:
      description: User information response (password excluded)
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        role: ADMIN
        id: 1
        enabled: true
        username: admin
      properties:
        id:
          description: User ID
          example: 1
          format: int64
          type: integer
        username:
          description: Username
          example: admin
          type: string
        role:
          description: User role
          enum:
          - ADMIN
          - ENTRANCE
          example: ADMIN
          type: string
        enabled:
          description: Whether the user account is enabled
          example: true
          type: boolean
        createdAt:
          description: Account creation timestamp
          format: date-time
          type: string
    CreateTableRequest:
      example:
        noOfUnavailableSeats: 12
        description: description
        noOfAvailableSeats: 2
        tableName: tableName
      properties:
        tableName:
          type: string
        noOfAvailableSeats:
          format: int32
          maximum: 20
          minimum: 1
          type: integer
        noOfUnavailableSeats:
          format: int32
          maximum: 20
          minimum: 1
          type: integer
        description:
          type: string
      required:
      - tableName
    SeatDetail:
      example:
        seatStatus: AVAILABLE
        updatedBy: updatedBy
        unavailable: true
        checkedIn: true
        available: true
        createdAt: 2000-01-23T04:56:07.000+00:00
        noWithStatus: noWithStatus
        tableDetail: null
        createdBy: createdBy
        reserved: true
        id: 1
        seatNo: seatNo
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          format: int64
          type: integer
        seatNo:
          type: string
        seatStatus:
          enum:
          - AVAILABLE
          - RESERVED
          - UNAVAILABLE
          - CHECKED_IN
          type: string
        tableDetail:
          $ref: '#/components/schemas/TableDetail'
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        createdBy:
          type: string
        updatedBy:
          type: string
        available:
          type: boolean
        noWithStatus:
          type: string
        unavailable:
          type: boolean
        checkedIn:
          type: boolean
        reserved:
          type: boolean
    TableDetail:
