spring:
  application:
    name: qr-seat-reservation-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qr-seat-reservation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:user}
    password: ${DB_PWD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        hbm2ddl:
          auto: update

#default settings
settings:
  ticket:
    prefix: "T"
    noOfDigits: 6
    maxNoOfTickets : 100
  qrImage :
    baseImagePath : "imgs/baseTicket.jpeg"
    fontSize : 28
    qrX : 450
    qrY : 20
    textX : 450
    textY: 320
  seatingLayout:
    tableSize : 100
    seatSize : 20
    noOfColumns : 5
